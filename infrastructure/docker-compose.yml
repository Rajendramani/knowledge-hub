
High-level Architecture (Microservices)

Frontend

React SPA (TypeScript optional)

Backend Microservices (Spring Boot)

Identity Service (Keycloak integration / IAM gateway config)

Note Service (Postgres)

Search Service (Mongo + index strategy; or Postgres full-text initially, later Mongo)

