Notification Service (Email/Push later; initially in-app)

Analytics Service (events consume செய்து stats உருவாக்கும்)

Infra

Redis cache

MQ (Kafka/RabbitMQ)

Observability: Zipkin + Grafana + ELK

Docker + Kubernetes

CI/CD pipeline

AWS deploy (EKS + RDS + ElastiCache + MSK/RabbitMQ option)

Tech Mapping (நீங்க சொன்ன எல்லாம் எங்கே வருது)

Java 21: virtual threads, structured concurrency (phase 2/3), records, pattern matching

Lambda/Streams: filtering, ranking, analytics pipelines

Threads/Executor/Multi-threading: AI calls parallel, search indexing workers, batch scoring

Spring Boot Microservices: above services

DSA:

Sorting → ranking results / leaderboard

Graph → topic dependency map (“what to learn next”)

Tree/Trie → autocomplete/tag suggestions (phase 2)

React: dashboard, editor, practice UI

IAM: Keycloak (Okta optional extension)

REST + GraphQL:

REST per service

GraphQL at API Gateway/BFF for frontend

DDD: bounded contexts (Notes, Practice, Search, Identity, AI)

Event-driven: MQ events (NoteCreated, NoteUpdated, PracticeCompleted…)

Zipkin: distributed tracing

Grafana: metrics dashboards

ELK: centralized logs

Redis: caching + rate limit + session tokens

Postgres: transactional store

MongoDB: search documents / AI conversation store (or index store)

MQ: RabbitMQ/Kafka

Docker/K8s/CI-CD/AWS: later phases

AI/LLM: prompt library + evaluation + cost controls